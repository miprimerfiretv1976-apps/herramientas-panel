<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d26; --surface2: #22263a; --border: #2e3347;
    --text: #e8eaf0; --muted: #7a8099; --accent: #4f8ef7;
    --ok: #3dd68c; --warn: #f5a623; --danger: #f04a4a; --pending: #a78bfa;
    --mono: 'Courier New', monospace; --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; overscroll-behavior-y: contain; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .logo { font-size: 15px; font-weight: 600; color: var(--text); }
  .logo span { color: var(--accent); }
  .ver-badge { font-size: 11px; font-family: var(--mono); color: var(--muted); background: var(--surface2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }
  .badge-count { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 99px; font-family: var(--mono); }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .last-update { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .refresh-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .stats-bar { display: flex; gap: 1.5rem; padding: .6rem 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat { font-size: 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; padding-bottom: 2px; }
  .stat strong { color: var(--text); font-family: var(--mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; padding: 1.25rem 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 8px; }
  .card.estado-trabajando { border-left: 3px solid var(--accent); }
  .card.estado-correcto   { border-left: 3px solid var(--ok); }
  .card.estado-esperar    { border-left: 3px solid var(--warn); }
  .card.estado-pendiente  { border-left: 3px solid var(--pending); }
  .card.estado-descartada { border-left: 3px solid var(--danger); opacity:.6; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-name { font-size: 13px; font-weight: 600; }
  .card-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge-estado { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; text-transform: uppercase; }
  .b-correcto { background: rgba(61,214,140,.15); color: var(--ok); }
  .b-trabajando { background: rgba(79,142,247,.15); color: var(--accent); }
  .b-esperar { background: rgba(245,166,35,.15); color: var(--warn); }
  .b-pendiente { background: rgba(167,139,250,.15); color: var(--pending); }
  .b-descartada { background: rgba(240,74,74,.15); color: var(--danger); }
  .tag { font-size: 11px; font-family: var(--mono); background: var(--surface2); border: 1px solid var(--border); padding: 2px 7px; border-radius: 4px; color: var(--muted); }
  .tag-icono { color: var(--accent); border-color: rgba(79,142,247,.3); }
  .meta-email { font-size: 11px; color: var(--muted); }
  .card-deploy { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  /* OPEN BUTTON */
  .btn-open { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, rgba(79,142,247,.18), rgba(79,142,247,.08)); border: 1px solid rgba(79,142,247,.35); border-radius: 8px; padding: 11px 14px; text-decoration: none; color: var(--accent); font-size: 13px; font-weight: 600; transition: all .18s; }
  .btn-open:hover { background: linear-gradient(135deg, rgba(79,142,247,.28), rgba(79,142,247,.14)); border-color: rgba(79,142,247,.6); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(79,142,247,.15); }
  .btn-open .open-icon { font-size: 18px; flex-shrink: 0; }
  .btn-open .open-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; flex: 1; }
  .btn-open .open-label { font-size: 13px; font-weight: 700; }
  .btn-open .open-url { font-size: 10px; color: var(--muted); font-family: var(--mono); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-open .open-arrow { font-size: 16px; opacity: .7; flex-shrink: 0; }
  /* VERSION BUMP */
  .ver-row { display: flex; align-items: center; gap: 6px; }
  .ver-num { font-size: 12px; font-family: var(--mono); color: var(--ok); font-weight: 700; min-width: 32px; }
  .ver-num.sin-ver { color: var(--muted); font-weight: 400; }
  .btn-bump { background: rgba(61,214,140,.1); border: 1px solid rgba(61,214,140,.3); color: var(--ok); padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; transition: all .15s; white-space: nowrap; }
  .btn-bump:hover { background: rgba(61,214,140,.2); }
  .btn-bump:disabled { opacity: .4; cursor: default; }
  .ver-inp { width: 70px; background: var(--surface2); border: 1px solid var(--accent); color: var(--text); padding: 3px 7px; border-radius: 6px; font-size: 12px; font-family: var(--mono); outline: none; text-align: center; }
  /* ESTADO SELECT */
  .estado-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; outline: none; width: 100%; }
  .estado-select:focus { border-color: var(--accent); }
  /* OBS / CHANGELOG */
  .section-block { border-top: 1px solid var(--border); padding-top: 8px; }
  .section-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .section-label button { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0; }
  .section-label button:hover { color: var(--accent); }
  .obs-text { font-size: 12px; color: #a0a8c0; line-height: 1.5; }
  .obs-empty { font-style: italic; color: #3a3f55; }
  .obs-add { display: flex; gap: 6px; margin-top: 6px; }
  .obs-add input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 9px; border-radius: 6px; font-size: 12px; outline: none; }
  .obs-add input:focus { border-color: var(--accent); }
  .obs-add button { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .obs-add button:hover { border-color: var(--accent); color: var(--accent); }
  /* CHANGELOG colapsable */
  .changelog-toggle { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .changelog-toggle:hover .cl-arrow { color: var(--accent); }
  .cl-arrow { font-size: 10px; color: var(--muted); transition: transform .2s; }
  .cl-arrow.open { transform: rotate(180deg); }
  .changelog-body { display: none; margin-top: 6px; }
  .changelog-body.open { display: block; }
  .changelog-content { font-size: 12px; color: #a0a8c0; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .changelog-empty { font-style: italic; color: #3a3f55; font-size: 12px; }
  /* EMAIL */
  .email-edit-wrap { display: none; margin-top: 4px; }
  /* DELETE */
  .btn-delete { background: transparent; border: 1px solid var(--border); color: var(--danger); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%; margin-top: 4px; }
  .btn-delete:hover { background: rgba(240,74,74,.1); border-color: var(--danger); }
  .empty-state { grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--muted); font-size: 13px; }
  .search-bar { padding: .6rem 1.5rem; border-bottom: 1px solid var(--border); }
  .search-bar input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 13px; outline: none; }
  .search-bar input:focus { border-color: var(--accent); }
  /* TOAST centrado */
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 999; opacity: 0; transition: all .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok  { border-color: var(--ok);     color: var(--ok); }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  /* MODALES */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; width: 300px; }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--danger); }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 1rem; line-height: 1.5; }
  .modal input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 20px; outline: none; letter-spacing: 6px; text-align: center; margin-bottom: 8px; }
  .modal input:focus { border-color: var(--danger); }
  .modal-error { font-size: 12px; color: var(--danger); text-align: center; margin-bottom: 8px; display: none; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button { flex: 1; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid var(--border); }
  .btn-cancel  { background: transparent; color: var(--muted); }
  .btn-confirm { background: rgba(240,74,74,.15); color: var(--danger); border-color: rgba(240,74,74,.4) !important; }
  .modal-wide { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; width: 480px; max-width: 95vw; }
  .modal-wide h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .modal-wide p  { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .modal-wide textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none; resize: vertical; min-height: 160px; font-family: var(--sans); line-height: 1.6; }
  .modal-wide textarea:focus { border-color: var(--accent); }
  .form-group { margin-bottom: 10px; }
  .form-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 4px; }
  .form-group input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 13px; outline: none; }
  .form-group input:focus { border-color: var(--ok); }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; padding: .75rem; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">🛠 <span>Herramientas</span></span>
    <span class="ver-badge" id="header-ver"></span>
    <span class="badge-count" id="badge-count">— apps</span>
  </div>
  <div class="topbar-right">
    <span class="last-update" id="last-update">sin datos</span>
    <button class="refresh-btn" onclick="abrirModalNueva()" style="border-color:var(--ok);color:var(--ok);">+ Nueva</button>
    <button class="refresh-btn" onclick="loadSheet()">↺ Actualizar</button>
  </div>
</div>

<div id="app-section">
  <div class="stats-bar" id="stats-bar"></div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="🔍 Buscar herramienta..." oninput="renderCards()" />
  </div>
  <div class="grid" id="cards-grid"></div>
</div>

<div class="toast" id="toast"></div>

<!-- MODAL ELIMINAR -->
<div class="modal-bg" id="modal-eliminar">
  <div class="modal">
    <h3>🗑 Eliminar herramienta</h3>
    <p id="modal-nombre-text">¿Eliminar esta herramienta?</p>
    <input type="password" id="modal-pin" placeholder="PIN" maxlength="4" onkeydown="if(event.key==='Enter')confirmarPin()" />
    <div class="modal-error" id="modal-error">PIN incorrecto</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmarPin()">Eliminar</button>
    </div>
  </div>
</div>

<!-- MODAL OBS -->
<div class="modal-bg" id="modal-obs">
  <div class="modal-wide">
    <h3 style="color:var(--accent);">✏ Editar observaciones</h3>
    <p id="modal-obs-nombre"></p>
    <textarea id="modal-obs-textarea" placeholder="Escribí las observaciones…"></textarea>
    <div class="modal-btns" style="margin-top:10px;">
      <button class="btn-cancel" onclick="cerrarModalObs()">Cancelar</button>
      <button class="btn-confirm" style="background:rgba(79,142,247,.15);color:var(--accent);border-color:rgba(79,142,247,.4)!important;" onclick="guardarObsModal()">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL CHANGELOG -->
<div class="modal-bg" id="modal-changelog">
  <div class="modal-wide">
    <h3 style="color:var(--pending);">📋 Editar descripción / changelog</h3>
    <p id="modal-changelog-nombre"></p>
    <textarea id="modal-changelog-textarea" placeholder="[dd/mm/yyyy] Descripción del cambio…&#10;[dd/mm/yyyy] Otro cambio…"></textarea>
    <div class="modal-btns" style="margin-top:10px;">
      <button class="btn-cancel" onclick="cerrarModalChangelog()">Cancelar</button>
      <button class="btn-confirm" style="background:rgba(167,139,250,.15);color:var(--pending);border-color:rgba(167,139,250,.4)!important;" onclick="guardarChangelogModal()">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL NUEVA -->
<div class="modal-bg" id="modal-nueva">
  <div class="modal-wide">
    <h3 style="color:var(--ok);">+ Nueva herramienta</h3>
    <p style="margin-bottom:14px;">Se agregará al final de la Sheet con estado CORRECTO.</p>
    <div class="form-group"><label>Nombre *</label><input type="text" id="nueva-nombre" placeholder="Ej: Mi App v1" /></div>
    <div class="form-group"><label>URL</label><input type="text" id="nueva-url" placeholder="https://..." /></div>
    <div class="form-group"><label>Ícono</label><input type="text" id="nueva-icono" placeholder="Ej: APP" /></div>
    <div class="form-group"><label>Descripción corta</label><input type="text" id="nueva-desc" placeholder="Para qué sirve..." /></div>
    <div class="form-group"><label>Email / Cuenta</label><input type="text" id="nueva-email" placeholder="cuenta@gmail.com" /></div>
    <div class="form-group"><label>Versión inicial</label><input type="number" id="nueva-ver" placeholder="Ej: 1" min="0" /></div>
    <div class="form-group"><label>Observaciones</label><input type="text" id="nueva-obs" placeholder="Nota inicial..." /></div>
    <p id="nueva-error" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;">El nombre es obligatorio.</p>
    <div class="modal-btns" style="margin-top:10px;">
      <button class="btn-cancel" onclick="cerrarModalNueva()">Cancelar</button>
      <button class="btn-confirm" style="background:rgba(61,214,140,.15);color:var(--ok);border-color:rgba(61,214,140,.4)!important;" onclick="guardarNueva()">✓ Agregar</button>
    </div>
  </div>
</div>

<script>
const APP_VERSION = 22;

const SHEET_ID   = '10irlDgBgsMVTTI4C1l-otFsNjhhWJr1otr4X3JXKT00';
const SHEET_NAME = 'HERRAMIENTAS';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZ2ZVMOXAVVAxCPmtGE8q_yQT6mQpTWcf-X0IrpjI7Tcyq1ub3xZCoFO3gKcvebKR3/exec';

document.title = `Herramientas v${APP_VERSION}`;
document.getElementById('header-ver').textContent = `v${APP_VERSION}`;

let tools = [];
let filter = 'all';
let pendingDeleteIdx = null;
let pendingObsIdx = null;
let pendingChangelogIdx = null;
let _hayEdicionPendiente = false;

function marcarEdicion(val) { _hayEdicionPendiente = val; }

// Regla 3: protección salida
window.addEventListener('beforeunload', e => {
  if (_hayEdicionPendiente) { e.preventDefault(); e.returnValue = ''; }
});
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => {
  if (_hayEdicionPendiente) {
    history.pushState(null, '', location.href);
    if (confirm('Tenés cambios sin guardar. ¿Salir de todas formas?')) {
      _hayEdicionPendiente = false; history.back();
    }
  } else {
    history.pushState(null, '', location.href);
  }
});

async function loadSheet() {
  document.getElementById('cards-grid').innerHTML = '<div class="empty-state">Cargando…</div>';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    tools = json.table.rows
      .filter(r => r.c[0]?.v)
      .map(r => ({
        nombre:        String(r.c[0]?.v  || ''),
        version:       r.c[1]?.v != null ? String(r.c[1].v) : '',
        url:           String(r.c[2]?.v  || ''),
        icono:         String(r.c[3]?.v  || ''),
        descripcion:   String(r.c[4]?.v  || ''),
        estado:        String(r.c[11]?.v || '').toLowerCase().trim(),
        cuenta:        String(r.c[12]?.v || ''),
        observaciones: String(r.c[13]?.v || ''),
        changelog:     String(r.c[14]?.v || ''),
      }));
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString('es-AR');
    document.getElementById('badge-count').textContent = tools.length + ' apps';
    updateStats();
    renderCards();
  } catch(e) {
    document.getElementById('cards-grid').innerHTML = '<div class="empty-state">❌ No se pudo leer la Sheet.</div>';
  }
}

function updateStats() {
  const c = {trabajando:0,correcto:0,esperar:0,pendiente:0,descartada:0};
  tools.forEach(t => { if(c[t.estado]!==undefined) c[t.estado]++; });
  const btn = (f,color,count,label) => `<div class="stat" style="color:${color};border-bottom:2px solid ${filter===f?color:'transparent'};" onclick="setFilter('${f}')"><strong>${count}</strong> ${label}</div>`;
  document.getElementById('stats-bar').innerHTML =
    `<div class="stat" style="border-bottom:2px solid ${filter==='all'?'var(--text)':'transparent'};" onclick="setFilter('all')"><strong>${tools.length}</strong> total</div>` +
    btn('trabajando','var(--accent)',c.trabajando,'trabajo') +
    btn('correcto','var(--ok)',c.correcto,'correctas') +
    btn('esperar','var(--warn)',c.esperar,'esperando') +
    btn('pendiente','var(--pending)',c.pendiente,'pendientes') +
    btn('descartada','var(--danger)',c.descartada,'descartadas');
}

function setFilter(f) { filter = f; updateStats(); renderCards(); }
const badgeClass = e => ({correcto:'b-correcto',trabajando:'b-trabajando',esperar:'b-esperar',pendiente:'b-pendiente',descartada:'b-descartada'}[e]||'b-esperar');
const badgeLabel = e => ({correcto:'Correcto',trabajando:'Trabajando',esperar:'Esperar',pendiente:'Pendiente',descartada:'Descartada'}[e]||e||'—');

function formatChangelog(txt) {
  if (!txt) return '';
  // <br> después de cada fecha [dd/mm/yyyy hh:mm]
  return txt.replace(/(\[\d{2}\/\d{2}\/\d{4}[^\]]*\])/g, '<br>$1');
}

function renderCards() {
  const q = (document.getElementById('search-input')?.value||'').toLowerCase();
  const list = tools.filter(t => (filter==='all'||t.estado===filter) && (!q||t.nombre.toLowerCase().includes(q)||t.descripcion.toLowerCase().includes(q)||t.icono.toLowerCase().includes(q)));
  const grid = document.getElementById('cards-grid');
  if (!list.length) { grid.innerHTML = '<div class="empty-state">No hay herramientas en esta categoría.</div>'; return; }
  grid.innerHTML = list.map(t => {
    const idx = tools.indexOf(t);
    const ec = 'estado-'+(t.estado||'esperar');
    const obs = t.observaciones
      ? `<div class="obs-text" id="obs-${idx}">${esc(t.observaciones)}</div>`
      : `<div class="obs-text obs-empty" id="obs-${idx}">Sin observaciones</div>`;
    const sel = ['trabajando','correcto','esperar','pendiente','descartada'].map(v=>`<option value="${v}"${t.estado===v?' selected':''}>${{trabajando:'🔵 Trabajando',correcto:'🟢 Correcto',esperar:'🟡 Esperar',pendiente:'🟣 Pendiente',descartada:'🔴 Descartada'}[v]}</option>`).join('');
    const verNum = t.version !== '' ? parseInt(t.version)||0 : null;
    const verLabel = verNum !== null ? `<span class="ver-num">v${verNum}</span>` : `<span class="ver-num sin-ver">sin ver</span>`;
    const urlValida = t.url && t.url !== 'null' && t.url.startsWith('http');
    const urlCorta = urlValida ? t.url.replace(/^https?:\/\//,'').replace(/\/$/,'') : '';
    const btnAbrir = urlValida ? `
      <a class="btn-open" href="${esc(t.url)}" target="_blank" rel="noopener">
        <span class="open-icon">🌐</span>
        <span class="open-text">
          <span class="open-label">Abrir aplicación</span>
          <span class="open-url">${esc(urlCorta)}</span>
        </span>
        <span class="open-arrow">↗</span>
      </a>` : '';

    // Changelog colapsado: muestra <br> después de fechas
    const clHtml = t.changelog
      ? `<div class="changelog-content" id="cl-${idx}">${formatChangelog(esc(t.changelog))}</div>`
      : `<div class="changelog-empty" id="cl-${idx}">Sin changelog aún</div>`;
    const clCount = t.changelog ? t.changelog.split(/\[/).length - 1 : 0;
    const clLabel = clCount > 0 ? `📋 Descripción / Changelog <span style="color:var(--muted);font-size:10px;">(${clCount} entrada${clCount!==1?'s':''})</span>` : '📋 Descripción / Changelog';

    return `<div class="card ${ec}" id="card-${idx}">
      <div class="card-top">
        <div><div class="card-name">${esc(t.nombre)}</div><div class="card-desc">${esc(t.descripcion)}</div></div>
        <span class="badge-estado ${badgeClass(t.estado)}">${badgeLabel(t.estado)}</span>
      </div>
      ${t.icono&&t.icono!=='null'?`<div><span class="tag tag-icono">${esc(t.icono)}</span></div>`:''}
      ${btnAbrir}
      <div class="ver-row">
        ${verLabel}
        <button class="btn-bump" onclick="bumpVersion(${idx})">+1 bump</button>
        <button class="btn-bump" style="background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.3);color:var(--accent);" onclick="editarVersion(${idx})">✏</button>
        <span style="font-size:11px;color:var(--muted);margin-left:2px;">→ CORRECTO</span>
      </div>
      ${t.cuenta&&t.cuenta!=='null'?`<div class="meta-email">✉ ${esc(t.cuenta)}</div>`:''}
      <select class="estado-select" onchange="cambiarEstado(${idx},this.value)">${sel}</select>

      <!-- OBSERVACIONES -->
      <div class="section-block">
        <div class="section-label">
          <span>Observaciones</span>
          <button onclick="editarObs(${idx})">✏ editar</button>
        </div>
        ${obs}
        <div class="obs-add">
          <input type="text" id="obs-inp-${idx}" placeholder="Agregar nota…" onkeydown="if(event.key==='Enter')addObs(${idx})"/>
          <button onclick="addObs(${idx})">+ Guardar</button>
        </div>
      </div>

      <!-- CHANGELOG colapsable -->
      <div class="section-block">
        <div class="section-label changelog-toggle" onclick="toggleChangelog(${idx})">
          <span>${clLabel}</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <button onclick="event.stopPropagation();editarChangelog(${idx})" style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0;">✏ editar</button>
            <span class="cl-arrow" id="cl-arrow-${idx}">▼</span>
          </div>
        </div>
        <div class="changelog-body" id="cl-body-${idx}">
          ${clHtml}
        </div>
      </div>

      <!-- EMAIL -->
      <div class="section-block">
        <div class="section-label">
          <span>Email / Cuenta</span>
          <button onclick="toggleEditEmail(${idx})">✏ editar</button>
        </div>
        <div id="email-display-${idx}" style="font-size:12px;color:var(--muted);">${t.cuenta&&t.cuenta!=='null'?esc(t.cuenta):'<em style="color:#3a3f55">Sin email</em>'}</div>
        <div class="email-edit-wrap" id="email-edit-${idx}">
          <div class="obs-add" style="margin-top:4px;">
            <input type="text" id="email-inp-${idx}" value="${t.cuenta&&t.cuenta!=='null'?esc(t.cuenta):''}" placeholder="email@ejemplo.com" onkeydown="if(event.key==='Enter')guardarEmail(${idx})"/>
            <button onclick="guardarEmail(${idx})">✓</button>
          </div>
        </div>
      </div>

      <button class="btn-delete" onclick="abrirModalEliminar(${idx})">🗑 Eliminar herramienta</button>
    </div>`;
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleChangelog(idx) {
  const body  = document.getElementById(`cl-body-${idx}`);
  const arrow = document.getElementById(`cl-arrow-${idx}`);
  if (!body) return;
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

async function callScript(payload) {
  const url = SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify(payload));
  try { await fetch(url, { mode: 'no-cors' }); } catch(e) {}
}

// ── BUMP VERSION ──
function editarVersion(idx) {
  marcarEdicion(true);
  const actual = tools[idx].version !== '' ? (parseInt(tools[idx].version)||0) : 0;
  const verEl = document.querySelector(`#card-${idx} .ver-num`);
  if (!verEl) return;
  const inp = document.createElement('input');
  inp.type = 'number'; inp.min = '0'; inp.value = actual; inp.className = 'ver-inp';
  verEl.replaceWith(inp);
  inp.focus(); inp.select();
  const guardar = async () => {
    const nueva = parseInt(inp.value) || 0;
    inp.disabled = true;
    await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'ver', valor: nueva });
    await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'estado', valor: 'CORRECTO' });
    tools[idx].version = String(nueva); tools[idx].estado = 'correcto';
    const span = document.createElement('span');
    span.className = 'ver-num'; span.textContent = 'v' + nueva;
    inp.replaceWith(span);
    const card = document.getElementById(`card-${idx}`);
    if (card) {
      card.className = 'card estado-correcto';
      const badge = card.querySelector('.badge-estado');
      if (badge) { badge.className = 'badge-estado b-correcto'; badge.textContent = 'Correcto'; }
      const sel = card.querySelector('.estado-select'); if (sel) sel.value = 'correcto';
    }
    updateStats(); marcarEdicion(false); showToast(`v${nueva} → CORRECTO ✓`, 'ok');
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') guardar();
    if (e.key === 'Escape') { const s = document.createElement('span'); s.className='ver-num'; s.textContent='v'+actual; inp.replaceWith(s); marcarEdicion(false); }
  });
  inp.addEventListener('blur', () => { if (!inp.disabled) guardar(); });
}

async function bumpVersion(idx) {
  marcarEdicion(false);
  const btn = document.querySelector(`#card-${idx} .btn-bump`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const actual = tools[idx].version !== '' ? (parseInt(tools[idx].version)||0) : 0;
  const nueva = actual + 1;
  await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'ver', valor: nueva });
  await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'estado', valor: 'CORRECTO' });
  tools[idx].version = String(nueva); tools[idx].estado = 'correcto';
  if (btn) { btn.disabled = false; btn.textContent = '+1 bump'; }
  const verEl = document.querySelector(`#card-${idx} .ver-num`);
  if (verEl) { verEl.className = 'ver-num'; verEl.textContent = 'v' + nueva; }
  const card = document.getElementById(`card-${idx}`);
  if (card) {
    card.className = 'card estado-correcto';
    const badge = card.querySelector('.badge-estado');
    if (badge) { badge.className = 'badge-estado b-correcto'; badge.textContent = 'Correcto'; }
    const sel = card.querySelector('.estado-select'); if (sel) sel.value = 'correcto';
  }
  updateStats(); showToast(`v${nueva} → CORRECTO ✓`, 'ok');
}

// ── OBS ──
function editarObs(idx) {
  marcarEdicion(true);
  pendingObsIdx = idx;
  document.getElementById('modal-obs-nombre').textContent = tools[idx].nombre;
  document.getElementById('modal-obs-textarea').value = tools[idx].observaciones || '';
  document.getElementById('modal-obs').classList.add('show');
  setTimeout(() => document.getElementById('modal-obs-textarea').focus(), 100);
}
function cerrarModalObs() { document.getElementById('modal-obs').classList.remove('show'); pendingObsIdx = null; marcarEdicion(false); }
async function guardarObsModal() {
  const idx = pendingObsIdx;
  const val = document.getElementById('modal-obs-textarea').value.trim();
  cerrarModalObs();
  await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'observaciones', valor: val });
  tools[idx].observaciones = val;
  const el = document.getElementById(`obs-${idx}`);
  if (el) { el.className = val ? 'obs-text' : 'obs-text obs-empty'; el.textContent = val || 'Sin observaciones'; }
  showToast('Observaciones actualizadas ✓', 'ok');
}
async function addObs(idx) {
  const inp = document.getElementById(`obs-inp-${idx}`);
  const val = inp.value.trim(); if (!val) return;
  const btn = inp.nextElementSibling; btn.textContent = '…'; btn.disabled = true;
  await callScript({ action: 'addObs', nombre: tools[idx].nombre, obs: val });
  const ts = new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  tools[idx].observaciones = tools[idx].observaciones ? tools[idx].observaciones + ` · [${ts}] ${val}` : `[${ts}] ${val}`;
  const el = document.getElementById(`obs-${idx}`);
  if (el) { el.classList.remove('obs-empty'); el.textContent = tools[idx].observaciones; }
  inp.value = ''; btn.textContent = '✓'; btn.disabled = false;
  setTimeout(() => btn.textContent = '+ Guardar', 1800);
  showToast('Nota guardada ✓', 'ok');
}

// ── CHANGELOG ──
function editarChangelog(idx) {
  marcarEdicion(true);
  pendingChangelogIdx = idx;
  document.getElementById('modal-changelog-nombre').textContent = tools[idx].nombre;
  document.getElementById('modal-changelog-textarea').value = tools[idx].changelog || '';
  document.getElementById('modal-changelog').classList.add('show');
  setTimeout(() => document.getElementById('modal-changelog-textarea').focus(), 100);
}
function cerrarModalChangelog() { document.getElementById('modal-changelog').classList.remove('show'); pendingChangelogIdx = null; marcarEdicion(false); }
async function guardarChangelogModal() {
  const idx = pendingChangelogIdx;
  const val = document.getElementById('modal-changelog-textarea').value.trim();
  cerrarModalChangelog();
  await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'changelog', valor: val });
  tools[idx].changelog = val;
  const el = document.getElementById(`cl-${idx}`);
  if (el) {
    if (val) { el.className = 'changelog-content'; el.innerHTML = formatChangelog(esc(val)); }
    else { el.className = 'changelog-empty'; el.textContent = 'Sin changelog aún'; }
  }
  const clCount = val ? val.split(/\[/).length - 1 : 0;
  showToast('Changelog actualizado ✓', 'ok');
}

// ── EMAIL ──
function toggleEditEmail(idx) {
  const d = document.getElementById(`email-edit-${idx}`);
  d.style.display = d.style.display === 'none' || d.style.display === '' ? 'block' : 'none';
  if (d.style.display === 'block') document.getElementById(`email-inp-${idx}`).focus();
}
async function guardarEmail(idx) {
  marcarEdicion(false);
  const val = document.getElementById(`email-inp-${idx}`).value.trim();
  await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'email', valor: val });
  tools[idx].cuenta = val;
  const d = document.getElementById(`email-display-${idx}`);
  if (d) d.innerHTML = val || '<em style="color:#3a3f55">Sin email</em>';
  document.getElementById(`email-edit-${idx}`).style.display = 'none';
  showToast('Email actualizado ✓', 'ok');
}

// ── ESTADO ──
async function cambiarEstado(idx, nuevoEstado) {
  if (!nuevoEstado) return;
  await callScript({ action: 'update', nombre: tools[idx].nombre, campo: 'estado', valor: nuevoEstado });
  tools[idx].estado = nuevoEstado;
  const card = document.getElementById(`card-${idx}`);
  if (card) {
    card.className = `card estado-${nuevoEstado}`;
    const badge = card.querySelector('.badge-estado');
    if (badge) { badge.className = `badge-estado ${badgeClass(nuevoEstado)}`; badge.textContent = badgeLabel(nuevoEstado); }
  }
  updateStats(); showToast(`Estado → ${badgeLabel(nuevoEstado)} ✓`, 'ok');
}

// ── ELIMINAR ──
function abrirModalEliminar(idx) {
  pendingDeleteIdx = idx;
  document.getElementById('modal-nombre-text').textContent = '¿Eliminar "' + tools[idx].nombre + '" de la Sheet?';
  document.getElementById('modal-pin').value = '';
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-eliminar').classList.add('show');
  setTimeout(() => document.getElementById('modal-pin').focus(), 100);
}
function cerrarModal() { document.getElementById('modal-eliminar').classList.remove('show'); pendingDeleteIdx = null; }
function confirmarPin() {
  if (document.getElementById('modal-pin').value !== '7749') {
    document.getElementById('modal-error').style.display = 'block';
    document.getElementById('modal-pin').value = ''; return;
  }
  const idx = pendingDeleteIdx; const nombre = tools[idx].nombre; cerrarModal();
  const url = SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify({ action: 'eliminar', nombre }));
  window.open(url, '_blank');
  tools.splice(idx, 1);
  document.getElementById('badge-count').textContent = tools.length + ' apps';
  updateStats(); renderCards(); showToast('Eliminada ✓ — cerrá la pestaña', 'ok');
}

// ── NUEVA ──
function abrirModalNueva() {
  ['nueva-nombre','nueva-url','nueva-icono','nueva-desc','nueva-email','nueva-ver','nueva-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('nueva-error').style.display = 'none';
  document.getElementById('modal-nueva').classList.add('show');
  setTimeout(() => document.getElementById('nueva-nombre').focus(), 100);
}
function cerrarModalNueva() { document.getElementById('modal-nueva').classList.remove('show'); }
async function guardarNueva() {
  const nombre = document.getElementById('nueva-nombre').value.trim();
  if (!nombre) { document.getElementById('nueva-error').style.display = 'block'; return; }
  const nueva = {
    nombre, url: document.getElementById('nueva-url').value.trim(),
    icono: document.getElementById('nueva-icono').value.trim(),
    descripcion: document.getElementById('nueva-desc').value.trim(),
    cuenta: document.getElementById('nueva-email').value.trim(),
    version: document.getElementById('nueva-ver').value.trim() || '1',
    observaciones: document.getElementById('nueva-obs').value.trim(),
    estado: 'correcto', vuelve: '', changelog: ''
  };
  cerrarModalNueva();
  await callScript({ action: 'agregar', tool: nueva });
  tools.push(nueva);
  document.getElementById('badge-count').textContent = tools.length + ' apps';
  updateStats(); renderCards();
  setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
  showToast('"' + nombre + '" agregada ✓', 'ok');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 2500);
}

loadSheet();
</script>
